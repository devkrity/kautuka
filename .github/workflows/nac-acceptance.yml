name: Network Access Control Acceptance

on:
  push:
    branches:
      - 'enhancement/**'
      - main
  pull_request:
    branches:
      - 'enhancement/**'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nac-windows:
    name: NAC Windows Unit Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install repository dependencies
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm install --frozen-lockfile

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows NAC verification and recovery tests
        run: dotnet test src/tests/Kautuka.IntegrationTests/Kautuka.IntegrationTests.csproj --filter "FullyQualifiedName~WindowsPodmanDevEgressOptionsTests|FullyQualifiedName~WorkloadRegistryTrustLifecycleTests|FullyQualifiedName~WorkloadPostStartVerifierTests|FullyQualifiedName~V7_55_ReconcileFailClosedTests|FullyQualifiedName~V7_55_ReconcileQuarantineRetryTests|FullyQualifiedName~V7_55_QuarantinePersistenceTests|FullyQualifiedName~ProductionDnsBoundaryAllowsOnlyTheCoreDnsGateway"

  nac-acceptance:
    name: NAC Acceptance Suite (Linux)
    needs: nac-windows
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require Windows NAC tests to pass
        run: test '${{ needs.nac-windows.result }}' = success

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables util-linux podman conntrack

      - name: Run Hook Unit Tests
        run: |
          python3 scripts/nac/test_kautuka_hook.py

      - name: Run launcher tests
        run: node --test scripts/test-launcher-nac-hook.mjs scripts/test-launcher-web-tools.mjs scripts/launcher-readiness.test.mjs

      - name: Build Solution
        run: |
          dotnet build src/Kautuka.slnx -c Release

      - name: Prepare rootless Podman runtime directory
        run: |
          runtime_dir="/run/user/$(id -u)"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Run Disabled-Brake Production Negative Control
        shell: bash
        run: |
          set -euo pipefail
          mutant_root="$RUNNER_TEMP/kautuka-brake-nc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$mutant_root" ]]; then
            echo "Refusing to reuse existing mutation worktree path: $mutant_root" >&2
            exit 1
          fi
          cleanup_mutant_worktree() {
            git -C "$GITHUB_WORKSPACE" worktree remove --force "$mutant_root" || true
            git -C "$GITHUB_WORKSPACE" worktree prune
          }
          trap cleanup_mutant_worktree EXIT

          git -C "$GITHUB_WORKSPACE" worktree add --detach "$mutant_root" "$GITHUB_SHA"
          python3 - "$mutant_root/src/backend/Kautuka.Manager/Grpc/WorkspaceGrpcService.NetworkAccess.cs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          call = """            string? targetUser = string.Equals(request.Scope, "system", StringComparison.OrdinalIgnoreCase)
                          ? null
                          : (string.IsNullOrWhiteSpace(request.UserId) ? request.Actor.UserId : request.UserId);
                      await egressTopologyManager.EngageBrakeAsync(targetUser, Nac.Registry, CancellationToken.None).ConfigureAwait(false);"""
          if source.count(call) != 1:
              raise SystemExit(f"Expected exactly one production EngageBrakeAsync block; found {source.count(call)}")
          path.write_text(source.replace(call, "            // NC mutation: intentionally omit the production workload stop."), encoding="utf-8")
          PY

          git -C "$mutant_root" diff --binary HEAD -- src/backend/Kautuka.Manager/Grpc/WorkspaceGrpcService.NetworkAccess.cs > "$GITHUB_WORKSPACE/nac-brake-nc-mutation.patch"
          test -s "$GITHUB_WORKSPACE/nac-brake-nc-mutation.patch"
          git -C "$mutant_root" rev-parse HEAD > "$GITHUB_WORKSPACE/nac-brake-nc-source-revision.txt"
          dotnet build "$mutant_root/src/tests/Kautuka.NetworkAccess.Acceptance/Kautuka.NetworkAccess.Acceptance.csproj" -c Release

          baseline_manager="$GITHUB_WORKSPACE/src/tests/Kautuka.NetworkAccess.Acceptance/bin/Release/net10.0/Kautuka.Manager.dll"
          mutant_manager="$mutant_root/src/tests/Kautuka.NetworkAccess.Acceptance/bin/Release/net10.0/Kautuka.Manager.dll"
          test -f "$baseline_manager"
          test -f "$mutant_manager"
          baseline_hash="$(sha256sum "$baseline_manager" | cut -d ' ' -f 1)"
          mutant_hash="$(sha256sum "$mutant_manager" | cut -d ' ' -f 1)"
          if [[ "$baseline_hash" == "$mutant_hash" ]]; then
            echo "The mutated Manager build is byte-identical to the normal build." >&2
            exit 1
          fi
          {
            echo "source_revision=$(cat "$GITHUB_WORKSPACE/nac-brake-nc-source-revision.txt")"
            echo "normal_manager_sha256=$baseline_hash"
            echo "mutated_manager_sha256=$mutant_hash"
            echo "mutation_patch_sha256=$(sha256sum "$GITHUB_WORKSPACE/nac-brake-nc-mutation.patch" | cut -d ' ' -f 1)"
          } > "$GITHUB_WORKSPACE/nac-brake-nc-build-evidence.txt"

          set +e
          dotnet "$mutant_root/src/tests/Kautuka.NetworkAccess.Acceptance/bin/Release/net10.0/Kautuka.NetworkAccess.Acceptance.dll" \
            --prod-run "$GITHUB_WORKSPACE/nac-brake-nc-report.json"
          mutant_exit=$?
          set -e
          if [[ "$mutant_exit" -eq 0 ]]; then
            echo "The production acceptance unexpectedly passed with EngageBrakeAsync disabled." >&2
            exit 1
          fi
          jq -e --arg expected 'existingStopped=False:otherUserRunning=True:newLaunchRejected=True:releaseLaunchRunning=True:responseContainsUser=True' '
            [ .observations[] | select(.testId == "PROD_USER_BRAKE") ] as $matches
            | ($matches | length) == 1
              and $matches[0].observedValue == $expected
              and ($matches[0].outcome | startswith("FAIL"))
              and ($matches[0].ncFlipped == false)
          ' "$GITHUB_WORKSPACE/nac-brake-nc-report.json"

      - name: Run Production NAC and C6 Acceptance
        run: |
          dotnet src/tests/Kautuka.NetworkAccess.Acceptance/bin/Release/net10.0/Kautuka.NetworkAccess.Acceptance.dll \
            --prod-run "$GITHUB_WORKSPACE/nac-prod-report.json" \
            --brake-nc-report "$GITHUB_WORKSPACE/nac-brake-nc-report.json"

      - name: Upload production acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nac-prod-report-${{ github.sha }}
          path: |
            nac-prod-report.json
            nac-brake-nc-report.json
            nac-brake-nc-mutation.patch
            nac-brake-nc-source-revision.txt
            nac-brake-nc-build-evidence.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Run Integration Tests
        run: |
          dotnet test src/tests/Kautuka.IntegrationTests/Kautuka.IntegrationTests.csproj -c Release --no-build
