name: Network Access Control Acceptance

on:
  push:
    branches:
      - nac-v7
      - main
  pull_request:
    branches:
      - nac-v7
      - main
  workflow_dispatch:

jobs:
  nac-acceptance:
    name: NAC Acceptance Suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables util-linux podman conntrack

      - name: Run Hook Unit Tests
        run: |
          python3 scripts/nac/test_kautuka_hook.py

      - name: Build Solution
        run: |
          dotnet build src/Kautuka.slnx -c Release

      - name: Prepare rootless Podman runtime directory
        run: |
          runtime_dir="/run/user/$(id -u)"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Run Production NAC and C6 Acceptance
        run: |
          dotnet src/tests/Kautuka.NetworkAccess.Acceptance/bin/Release/net10.0/Kautuka.NetworkAccess.Acceptance.dll --prod-run "$GITHUB_WORKSPACE/nac-prod-report.json"

      - name: Upload production acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nac-prod-report-${{ github.sha }}
          path: nac-prod-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Run Integration Tests
        run: |
          dotnet test src/tests/Kautuka.IntegrationTests/Kautuka.IntegrationTests.csproj -c Release --no-build
