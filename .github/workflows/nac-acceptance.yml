name: Network Access Control Acceptance

on:
  push:
    branches:
      - nac-v7
      - main
  pull_request:
    branches:
      - nac-v7
      - main
  workflow_dispatch:

jobs:
  nac-acceptance:
    name: NAC Acceptance Suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables util-linux podman

      - name: Run Hook Unit Tests
        run: |
          python3 scripts/nac/test_kautuka_hook.py

      - name: Build Solution
        run: |
          dotnet build src/Kautuka.slnx -c Release

      - name: Run Integration Tests
        run: |
          dotnet test src/tests/Kautuka.IntegrationTests/Kautuka.IntegrationTests.csproj -c Release --no-build
