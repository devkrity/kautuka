name: Release Publish Assets

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      prerelease:
        required: true
        type: string
      dry_run:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      wsl_rootfs_asset_name:
        required: true
        type: string
jobs:

  compose-release-asset-manifest:
    name: Compose Release Asset Manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Normalize artifact scope
        id: scope
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          artifact_scope="$(printf '%s' "$RELEASE_TAG" | tr -cs '[:alnum:]._-' '-')"
          artifact_scope="${artifact_scope#-}"
          artifact_scope="${artifact_scope%-}"
          if [[ -z "$artifact_scope" ]]; then
            echo 'error: normalized artifact scope is empty.' >&2
            exit 1
          fi
          echo "artifact_scope=$artifact_scope" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kautuka-*-${{ steps.scope.outputs.artifact_scope }}
          path: release-artifacts

      - name: Generate asset manifest and checksums
        run: |
          node scripts/generate-release-asset-manifest.mjs \
            --directory release-artifacts \
            --relative-prefix release-artifacts
          cp release-artifacts/kautuka-release-assets.sha256 .
          cp release-artifacts/kautuka-release-assets.json .

      - name: Upload asset manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautuka-release-asset-manifest-${{ steps.scope.outputs.artifact_scope }}
          path: |
            kautuka-release-assets.sha256
            kautuka-release-assets.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  compose-release-entrypoint-notes:
    name: Compose Release Entrypoint Notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Normalize artifact scope
        id: scope
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          artifact_scope="$(printf '%s' "$RELEASE_TAG" | tr -cs '[:alnum:]._-' '-')"
          artifact_scope="${artifact_scope#-}"
          artifact_scope="${artifact_scope%-}"
          if [[ -z "$artifact_scope" ]]; then
            echo 'error: normalized artifact scope is empty.' >&2
            exit 1
          fi

          echo "artifact_scope=$artifact_scope" >> "$GITHUB_OUTPUT"

      - name: Write release entrypoint notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHANNEL: ${{ inputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          repository_url="https://github.com/${GITHUB_REPOSITORY}"
          cat > kautuka-release-entrypoints.md <<EOF
          ## Install Kautuka

          **Windows (64-bit)** — [Download the Kautuka installer](${repository_url}/releases/download/${RELEASE_TAG}/Kautuka.Installer.exe) and run it. The installer downloads and verifies the WSL appliance for you; do not download the appliance archive manually.

          **Linux (x86-64)** — [Download the Linux installer](${repository_url}/releases/download/${RELEASE_TAG}/kautuka-install-linux.sh). Before running it with sudo, verify it with \`gh attestation verify ./kautuka-install-linux.sh --repo devkrity/kautuka --signer-workflow devkrity/kautuka/.github/workflows/release-build-platform-assets.yml\`. The script downloads and verifies the Linux application payload.

          ## About the other files

          The platform archives and signed manifest are downloaded and verified automatically by the installers and updater. Most users should not download them manually. \`kautuka-release-support.zip\` contains the license texts, third-party notices, SBOMs, component inventory, and corresponding source archives.

          The Windows installer is unsigned for this ${CHANNEL} release unless \`SIGNING-STATUS.txt\` says \`SIGNED\`; Windows SmartScreen may warn.
          EOF

      - name: Upload release entrypoint notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautuka-release-entrypoint-notes-${{ steps.scope.outputs.artifact_scope }}
          path: kautuka-release-entrypoints.md
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - compose-release-asset-manifest
      - compose-release-entrypoint-notes
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.channel == 'stable' && 'stable' || 'preview' }}
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Normalize artifact scope
        id: scope
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          artifact_scope="$(printf '%s' "$RELEASE_TAG" | tr -cs '[:alnum:]._-' '-')"
          artifact_scope="${artifact_scope#-}"
          artifact_scope="${artifact_scope%-}"
          if [[ -z "$artifact_scope" ]]; then
            echo 'error: normalized artifact scope is empty.' >&2
            exit 1
          fi

          echo "artifact_scope=$artifact_scope" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kautuka-*-${{ steps.scope.outputs.artifact_scope }}
          path: release-artifacts

      - name: Stage versioned release assets
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WSL_ROOTFS_ASSET_NAME: ${{ inputs.wsl_rootfs_asset_name }}
          ARTIFACT_SCOPE: ${{ steps.scope.outputs.artifact_scope }}
        run: |
          set -euo pipefail
          scope="$ARTIFACT_SCOPE"
          root="release-artifacts"
          release_dir="release-stage/releases/${RELEASE_TAG}"

          mkdir -p "$release_dir"

          copy_required() {
            local source="$1"
            local destination="$2"
            if [[ ! -f "$source" ]]; then
              echo "error: required release artifact not found: $source" >&2
              find "$root" -type f >&2 || true
              exit 1
            fi
            mkdir -p "$(dirname "$destination")"
            cp "$source" "$destination"
          }

          copy_required "${root}/kautuka-linux-installer-assets-${scope}/kautuka-install-linux.sh" "${release_dir}/kautuka-install-linux.sh"
          copy_required "${root}/kautuka-windows-installer-assets-${scope}/Kautuka.Installer.exe" "${release_dir}/Kautuka.Installer.exe"
          copy_required "${root}/kautuka-windows-installer-assets-${scope}/LICENSE" "${release_dir}/LICENSE"
          copy_required "${root}/kautuka-windows-installer-assets-${scope}/NOTICE" "${release_dir}/NOTICE"
          copy_required "${root}/kautuka-windows-installer-assets-${scope}/SIGNING-STATUS.txt" "${release_dir}/SIGNING-STATUS.txt"
          copy_required "${root}/kautuka-platform-linux-x64-${scope}/kautuka-linux-amd64.tar.gz" "${release_dir}/kautuka-linux-amd64.tar.gz"
          copy_required "${root}/kautuka-wsl-rootfs-${scope}/${WSL_ROOTFS_ASSET_NAME}" "${release_dir}/${WSL_ROOTFS_ASSET_NAME}"
          copy_required "${root}/kautuka-platform-release-${scope}/kautuka-platform-release.json" "${release_dir}/kautuka-platform-release.json"
          copy_required "${root}/kautuka-platform-release-${scope}/kautuka-platform-release.sig" "${release_dir}/kautuka-platform-release.sig"
          copy_required "${root}/kautuka-platform-release-${scope}/manifest-public-key.pem" "release-stage/manifest-signing-public.pem"
          copy_required "${root}/kautuka-platform-release-${scope}/compliance/THIRD_PARTY_NOTICES.txt" "${release_dir}/THIRD_PARTY_NOTICES.txt"
          copy_required "${root}/kautuka-platform-release-${scope}/compliance/THIRD_PARTY_COMPONENTS.json" "${release_dir}/THIRD_PARTY_COMPONENTS.json"
          copy_required "${root}/kautuka-platform-release-${scope}/compliance/FRONTEND_DEPENDENCIES.json" "${release_dir}/FRONTEND_DEPENDENCIES.json"
          cp -a "${root}/kautuka-platform-release-${scope}/compliance/licenses" "${release_dir}/licenses"
          copy_required "${root}/kautuka-release-asset-manifest-${scope}/kautuka-release-assets.sha256" "${release_dir}/kautuka-release-assets.sha256"
          copy_required "${root}/kautuka-release-asset-manifest-${scope}/kautuka-release-assets.json" "${release_dir}/kautuka-release-assets.json"

          find "$release_dir" -type f | sort

      - name: Generate release SPDX SBOM
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WSL_ROOTFS_ASSET_NAME: ${{ inputs.wsl_rootfs_asset_name }}
        run: |
          set -euo pipefail
          release_dir="release-stage/releases/${RELEASE_TAG}"
          mkdir -p sbom-input/linux-platform sbom-input/wsl-appliance
          tar -xzf "$release_dir/kautuka-linux-amd64.tar.gz" -C sbom-input/linux-platform
          tar -xzf "$release_dir/$WSL_ROOTFS_ASSET_NAME" -C sbom-input/wsl-appliance
          bash scripts/make-sbom-input-writable.sh sbom-input
          docker run --rm \
            -v "$PWD:/src" \
            docker.io/anchore/syft@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            dir:/src/sbom-input/linux-platform \
            -o spdx-json="/src/$release_dir/kautuka-linux-amd64.spdx.json"
          docker run --rm \
            -v "$PWD:/src" \
            docker.io/anchore/syft@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            dir:/src/sbom-input/wsl-appliance \
            -o spdx-json="/src/$release_dir/kautuka-wsl-appliance.spdx.json"
          while IFS=$'\t' read -r image_id archive_name; do
            docker run --rm \
              -v "$PWD:/src" \
              docker.io/anchore/syft@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
              docker-archive:"/src/sbom-input/wsl-appliance/var/lib/kautuka/oci-images/$archive_name" \
              -o spdx-json="/src/$release_dir/kautuka-${image_id}-image.spdx.json"
          done < <(jq -r '.images[] | [.id, .archive] | @tsv' src/backend/Kautuka.Manager/runtime-images.json)
          base_image="$(jq -r '.baseImage // empty' "$release_dir/THIRD_PARTY_COMPONENTS.json")"
          if [[ -z "$base_image" ]]; then
            echo 'error: release component inventory has no immutable kautuka-base image digest.' >&2
            exit 1
          fi
          docker run --rm \
            -v "$PWD:/src" \
            docker.io/anchore/syft@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            "registry:$base_image" \
            -o spdx-json="/src/$release_dir/kautuka-base-image.spdx.json"
          docker run --rm \
            -v "$PWD:/src" \
            docker.io/anchore/syft@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            "file:/src/$release_dir/Kautuka.Installer.exe" \
            -o spdx-json="/src/$release_dir/kautuka-windows-installer.spdx.json"
          bash scripts/stage-third-party-sources.sh \
            --release-dir "$release_dir" \
            --wsl-rootfs sbom-input/wsl-appliance \
            --base-image "$base_image"
          node scripts/generate-release-credits.mjs --directory "$release_dir"
          python3 - "$release_dir" <<'PY'
          import pathlib
          import sys
          import zipfile
          import shutil

          release = pathlib.Path(sys.argv[1])
          for source_name, archive_name in [('licenses', 'kautuka-licenses.zip'), ('sources', 'kautuka-third-party-sources.zip')]:
              source = release / source_name
              if not source.is_dir():
                  raise SystemExit(f'missing required release bundle: {source}')
              with zipfile.ZipFile(release / archive_name, 'w', compression=zipfile.ZIP_DEFLATED) as bundle:
                  for item in sorted(source.rglob('*')):
                      if item.is_file():
                          bundle.write(item, item.relative_to(release))
              if not (release / archive_name).stat().st_size:
                  raise SystemExit(f'empty release bundle: {archive_name}')
              shutil.rmtree(source)

          support_names = [
              'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.txt', 'THIRD_PARTY_COMPONENTS.json',
              'FRONTEND_DEPENDENCIES.json', 'CREDITS.md', 'kautuka-licenses.zip',
              'kautuka-third-party-sources.zip',
          ]
          support_files = [release / name for name in support_names]
          support_files.extend(sorted(release.glob('*.spdx.json')))
          missing = [str(item.name) for item in support_files if not item.is_file()]
          if missing:
              raise SystemExit(f'missing release support files: {", ".join(missing)}')

          support_archive = release / 'kautuka-release-support.zip'
          with zipfile.ZipFile(support_archive, 'w', compression=zipfile.ZIP_DEFLATED) as bundle:
              for item in support_files:
                  archive_compression = zipfile.ZIP_STORED if item.suffix == '.zip' else zipfile.ZIP_DEFLATED
                  bundle.write(item, item.name, compress_type=archive_compression)
          if not support_archive.stat().st_size:
              raise SystemExit('empty release support archive')

          for item in support_files:
              item.unlink()
          PY
          rm -rf sbom-input

          node scripts/generate-release-asset-manifest.mjs \
            --directory "$release_dir" \
            --relative-prefix "releases/$RELEASE_TAG"

      - name: Prepare release notes
        env:
          ARTIFACT_SCOPE: ${{ steps.scope.outputs.artifact_scope }}
        run: |
          notes="release-artifacts/kautuka-release-entrypoint-notes-${ARTIFACT_SCOPE}/kautuka-release-entrypoints.md"
          test -s "$notes"
          mkdir -p release-notes
          cp "$notes" release-notes/kautuka-release-entrypoints.md

      - name: Validate complete flat release asset set
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-assets.mjs --directory "release-stage/releases/${RELEASE_TAG}" --tag "$RELEASE_TAG"

      - name: Confirm release draft is empty and immutable-release compatible
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          existing="$(bash scripts/find-github-release-by-tag.sh "$REPOSITORY" "$RELEASE_TAG")"
          if [[ "$existing" == 'null' ]]; then
            echo "error: release draft $RELEASE_TAG was not found." >&2
            exit 1
          fi
          if [[ "$(jq -r '.draft' <<< "$existing")" != 'true' \
            || "$(jq -r '.target_commitish' <<< "$existing")" != "$SOURCE_SHA" ]]; then
            echo "error: release $RELEASE_TAG is not the expected unpublished draft." >&2
            exit 1
          fi
          expected_prerelease='false'
          if [[ "$CHANNEL" == 'preview' ]]; then expected_prerelease='true'; fi
          if [[ "$(jq -r '.prerelease' <<< "$existing")" != "$expected_prerelease" ]]; then
            echo "error: release $RELEASE_TAG has the wrong stable/preview type." >&2
            exit 1
          fi
          if [[ "$(jq '.assets | length' <<< "$existing")" != '0' ]]; then
            echo "error: release $RELEASE_TAG already has assets; refusing to replace draft assets." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --title "$RELEASE_VERSION" --notes-file release-notes/kautuka-release-entrypoints.md

      - name: Upload public release assets to the GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_dir="release-stage/releases/${RELEASE_TAG}"
          mapfile -t release_asset_names < <(jq -r '.[]' scripts/release-public-assets.json)
          release_assets=()
          for name in "${release_asset_names[@]}"; do
            asset="$release_dir/$name"
            if [[ ! -f "$asset" ]]; then
              echo "error: public release asset was not staged: $name" >&2
              exit 1
            fi
            release_assets+=("$asset")
          done
          ((${#release_assets[@]} > 0)) || { echo 'error: no release assets were staged.' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${release_assets[@]}"

      - name: Validate GitHub asset names, sizes, and digests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          existing="$(bash scripts/find-github-release-by-tag.sh "$REPOSITORY" "$RELEASE_TAG")"
          release_id="$(jq -er '.id' <<< "$existing")"
          expected="$(node - "release-stage/releases/${RELEASE_TAG}" <<'NODE'
          const fs = require('node:fs');
          const directory = process.argv[2];
          const names = JSON.parse(fs.readFileSync('scripts/release-public-assets.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(`${directory}/kautuka-release-assets.json`, 'utf8'));
          const byName = new Map(manifest.assets.map(asset => [asset.name, asset]));
          const selected = names.map(name => {
            const asset = byName.get(name);
            if (!asset) throw new Error(`public asset missing from verified inventory: ${name}`);
            return asset;
          });
          console.log(selected.map(asset => `${asset.name}\tsha256:${asset.sha256}\t${asset.sizeBytes}`).sort().join('\n'));
          NODE
          )"
          actual="$(gh api "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[] | [.name, (.digest // ""), .size] | @tsv' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'error: uploaded GitHub Release asset names, sizes, or SHA-256 digests differ from the validated local set.' >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
            exit 1
          fi

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          existing="$(bash scripts/find-github-release-by-tag.sh "$REPOSITORY" "$RELEASE_TAG")"
          release_id="$(jq -er '.id' <<< "$existing")"
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false --silent

      - name: Require GitHub immutable-release enforcement
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          existing="$(bash scripts/find-github-release-by-tag.sh "$REPOSITORY" "$RELEASE_TAG")"
          immutable="$(jq -r '.immutable // false' <<< "$existing")"
          if [[ "$immutable" != 'true' ]]; then
            echo 'error: GitHub did not mark the published release immutable; configure repository release immutability before cutover.' >&2
            exit 1
          fi
