name: Release Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Australia/Brisbane'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing main tag to rerun (preview) or promote (stable).
        required: false
        type: string
      publish_preview_now:
        description: Create and publish the next Preview from main now.
        required: true
        default: false
        type: boolean
      dry_run:
        description: Build and verify without publishing (leave true unless publishing).
        required: true
        default: true
        type: boolean

env:
  KAUTUKA_UPCOMING_STABLE_VERSION: '0.1.20'

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.publish_preview_now) && 'preview' || contains(inputs.release_tag, '-preview.') && 'preview' || 'stable' }}
  cancel-in-progress: false

jobs:
  resolve-channel:
    name: Resolve Release Channel
    if: ${{ github.event_name == 'workflow_dispatch' || vars.KAUTUKA_RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Require releases to run from main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != 'refs/heads/main' ]]; then
            echo "error: releases must be dispatched from refs/heads/main (received $RELEASE_REF)." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve channel
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_PREVIEW_NOW: ${{ inputs.publish_preview_now }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          UPCOMING_STABLE_VERSION: ${{ env.KAUTUKA_UPCOMING_STABLE_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          dry_run='false'
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$PUBLISH_PREVIEW_NOW" == 'true' ]]; then
            if [[ "$DRY_RUN" != 'false' ]]; then
              echo 'error: publishing a new Preview requires dry_run=false.' >&2
              exit 1
            fi
            if [[ -n "$RELEASE_TAG" ]]; then
              echo 'error: publish_preview_now creates the next Preview tag; do not also provide release_tag.' >&2
              exit 1
            fi
          fi
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$PUBLISH_PREVIEW_NOW" != 'true' ]]; then
            dry_run="$DRY_RUN"
            release_tag="$RELEASE_TAG"
            if [[ -z "$release_tag" ]]; then
              echo 'error: workflow_dispatch requires an existing release_tag.' >&2
              exit 1
            fi
            if [[ "$release_tag" == *-preview.* && "$dry_run" != 'true' ]]; then
              echo 'error: manual Preview reruns must use dry_run=true; use publish_preview_now to publish a new Preview.' >&2
              exit 1
            fi
          else
            release_tag=''
            version_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            if [[ ! "$UPCOMING_STABLE_VERSION" =~ $version_re ]]; then
              echo "error: KAUTUKA_UPCOMING_STABLE_VERSION must be plain SemVer (received $UPCOMING_STABLE_VERSION)." >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            version_prefix="v${UPCOMING_STABLE_VERSION}-preview."
            newest_number=-1
            newest_tag=''
            while IFS= read -r candidate; do
              suffix="${candidate#"$version_prefix"}"
              if [[ "$suffix" =~ ^(0|[1-9][0-9]*)$ ]] && (( suffix > newest_number )); then
                newest_number="$suffix"
                newest_tag="$candidate"
              fi
            done < <(git tag --list "${version_prefix}*")
            if [[ -n "$newest_tag" ]]; then
              last_preview_sha="$(git rev-parse "refs/tags/${newest_tag}^{commit}")"
              if ! git merge-base --is-ancestor "$last_preview_sha" "$main_sha"; then
                echo "error: newest preview tag $newest_tag is not on main history." >&2
                exit 1
              fi
              if [[ "$(git rev-list --count "${last_preview_sha}..${main_sha}")" == '0' ]]; then
                preview_retry="$(bash scripts/resolve-preview-retry.sh "$GITHUB_REPOSITORY" "$newest_tag" "$last_preview_sha" "$main_sha")"
                if [[ "$preview_retry" == 'skip' ]]; then
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  echo "No main commits have landed since the published immutable Preview $newest_tag; preview run skipped." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                if [[ "$preview_retry" != 'reuse' ]]; then
                  echo "error: unsafe retry resolution for Preview tag $newest_tag." >&2
                  exit 1
                fi
                release_tag="$newest_tag"
                echo "Retrying unpublished Preview $release_tag on its original main commit." >> "$GITHUB_STEP_SUMMARY"
              else
                next_number=$((newest_number + 1))
                release_tag="${version_prefix}${next_number}"
                git tag -a "$release_tag" "$main_sha" -m "Kautuka preview $release_tag"
                git push origin "refs/tags/$release_tag"
              fi
            else
              next_number=$((newest_number + 1))
              release_tag="${version_prefix}${next_number}"
              git tag -a "$release_tag" "$main_sha" -m "Kautuka preview $release_tag"
              git push origin "refs/tags/$release_tag"
            fi
          fi

          source_sha="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
          # main is the only allowed release branch. release/* stays disabled; add it here only after explicit approval.
          allowed_branches=(origin/main)
          eligible=false
          for branch in "${allowed_branches[@]}"; do
            if git merge-base --is-ancestor "$source_sha" "$branch"; then eligible=true; break; fi
          done
          if [[ "$eligible" != true ]]; then
            echo "error: release tag $release_tag does not point to a commit reachable from main." >&2
            exit 1
          fi

          channel='stable'
          prerelease='false'
          if [[ "$release_tag" == *-preview.* ]]; then channel='preview'; prerelease='true'; fi
          if [[ "$channel" == 'stable' ]]; then
            version="${release_tag#v}"
            preview_on_same_commit=false
            while IFS= read -r candidate; do
              candidate_sha="$(git rev-parse "refs/tags/${candidate}^{commit}")"
              if [[ "$candidate_sha" == "$source_sha" ]]; then preview_on_same_commit=true; break; fi
            done < <(git tag --list "v${version}-preview.*")
            if [[ "$preview_on_same_commit" != true ]]; then
              echo "error: stable tag $release_tag must point at the same main commit as a tested v${version}-preview.* tag." >&2
              exit 1
            fi
            if [[ "$dry_run" == 'false' ]]; then
              repository="${GITHUB_REPOSITORY}"
              if existing_release="$(gh api "repos/$repository/releases/tags/$release_tag" 2>/dev/null)"; then
                if [[ "$(jq -r '.draft' <<< "$existing_release")" != 'true' \
                  || "$(jq -r '.target_commitish' <<< "$existing_release")" != "$source_sha" ]]; then
                  echo "error: stable version $version has already been released and cannot be reused." >&2
                  exit 1
                fi
              fi
            fi
          fi
          node scripts/resolve-release.mjs "$release_tag" "$source_sha" "$dry_run"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  validate-release:
    name: Validate Release Inputs
    needs: resolve-channel
    if: ${{ needs.resolve-channel.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-channel.outputs.source_sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Narad validation dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Validate tracked hygiene
        run: node ./scripts/validate-tracked-hygiene.mjs

      - name: Test scheduled release gate
        run: node ./scripts/test-release-schedule-gate.mjs

      - name: Test Preview tag retry resolution
        run: node ./scripts/test-preview-retry-resolution.mjs

      - name: Test tracked hygiene rejection paths
        run: node ./scripts/test-tracked-hygiene.mjs

      - name: Validate documentation
        run: node ./scripts/validate-docs.mjs

      - name: Verify Linux installer trust preflight regressions
        run: bash ./scripts/test-linux-installer-security.sh

      - name: Verify Linux GitHub Release discovery
        run: node ./scripts/test-linux-github-release-discovery.mjs

      - name: Verify flat GitHub release asset regressions
        run: node ./scripts/test-release-assets.mjs

      - name: Verify release immutability preflight
        run: node ./scripts/test-release-immutability-preflight.mjs

      - name: Verify release attestation dry-run gate
        run: node ./scripts/test-release-attestation-gate.mjs

      - name: Verify release source preparation and channel configuration
        run: node ./scripts/test-release-source-preparation.mjs

      - name: Verify release build SDK matches global.json
        run: node ./scripts/test-release-build-sdk.mjs

      - name: Verify signed release signature URL routing
        run: node ./scripts/test-release-manifest-signature-url.mjs

      - name: Verify local release feed signature routes
        run: node ./scripts/test-serve-release-smoke.mjs

      - name: Verify frontend third-party inventory regressions
        run: node ./scripts/test-frontend-third-party-inventory.mjs

      - name: Validate Narad
        run: pnpm narad:check

      - name: Narad dependency audit
        run: node ./scripts/audit-dependencies.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Kautuka.slnx

      - name: Verify formatting
        run: dotnet format src/Kautuka.slnx --verify-no-changes

      - name: Build
        run: dotnet build src/Kautuka.slnx --no-restore

      - name: Test
        run: dotnet test --solution src/Kautuka.slnx --no-build

      - name: Narad security and performance gates
        run: dotnet test --solution src/Kautuka.slnx --no-build --filter "FullyQualifiedName~NaradSecurityTests|FullyQualifiedName~NaradPerformanceTests" -- --ignore-exit-code 8

      - name: Frontend Narad verify
        run: pnpm --dir src/frontend verify

      - name: Install acceptance workspace
        working-directory: src/tests/channel-acceptance
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run Playwright contract suite
        working-directory: src/tests/channel-acceptance
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm test:contract

      - name: Secrets scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --verbose --redact --no-banner

  # Hosted runners cannot wsl --import. This job is skipped unless
  # KAUTUKA_SMOKE_BASE_URL points at a live WebHost (self-hosted appliance).
  installed-linux-smoke:
    name: Installed Linux Smoke
    needs: validate-release
    if: ${{ vars.KAUTUKA_SMOKE_BASE_URL != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/installed-linux-smoke.yml

  prepare-stable-draft:
    name: Open Versioned Release Draft
    needs:
      - resolve-channel
      - validate-release
    if: ${{ needs.resolve-channel.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-channel.outputs.channel }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-channel.outputs.source_sha }}

      - name: Create stable GitHub release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-channel.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-channel.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve-channel.outputs.source_sha }}
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null)"; then
            if [[ "$(jq -r '.draft' <<< "$existing")" != 'true' \
              || "$(jq -r '.target_commitish' <<< "$existing")" != "$SOURCE_SHA" ]]; then
              echo "error: stable release $RELEASE_TAG already exists and cannot be reused." >&2
              exit 1
            fi
          else
            release_flags=(--draft)
            if [[ "$CHANNEL" == 'preview' ]]; then release_flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${release_flags[@]}" --verify-tag --title "$RELEASE_VERSION" \
              --target "$SOURCE_SHA" --notes "${CHANNEL^} release build and artifact verification are in progress."
          fi

  resolve-kautuka-base:
    name: Resolve approved kautuka-base digest
    needs:
      - resolve-channel
      - validate-release
    if: ${{ needs.resolve-channel.outputs.skip != 'true' && needs.validate-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-channel.outputs.source_sha }}

      - name: Resolve the selected independent base-image version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(jq -r '.image // empty' src/images/kautuka-base/release.json)"
          if [[ ! "$image" =~ ^ghcr\.io/devkrity/kautuka-base@sha256:[0-9a-f]{64}$ ]]; then
            echo 'error: src/images/kautuka-base/release.json must select an exact kautuka-base digest before an app release.' >&2
            exit 1
          fi
          echo "Selected base image digest: $image"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"
          resolved_image="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | grep '^ghcr.io/devkrity/kautuka-base@sha256:' | head -n 1 || true)"
          if [[ "$resolved_image" != "$image" ]]; then
            echo "error: pulled kautuka-base digest does not match the reviewed selection $image (resolved $resolved_image)." >&2
            exit 1
          fi
          echo "image=$resolved_image" >> "$GITHUB_OUTPUT"
          echo "Release will use $resolved_image; building Kautuka does not rebuild or retag kautuka-base."

  # Native AOT of Manager, Gateway, CredentialsHost, ChannelHost,
  # UpdateService, WebHost, and TUI is this job (scripts/build-release-assets.sh).
  build-platform-assets:
    name: Build Platform Assets
    needs:
      - resolve-channel
      - validate-release
      - resolve-kautuka-base
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build-platform-assets.yml
    with:
      channel: ${{ needs.resolve-channel.outputs.channel }}
      release_version: ${{ needs.resolve-channel.outputs.version }}
      manifest_version: ${{ needs.resolve-channel.outputs.version }}
      release_tag: ${{ needs.resolve-channel.outputs.release_tag }}
      source_sha: ${{ needs.resolve-channel.outputs.source_sha }}
      dry_run: ${{ needs.resolve-channel.outputs.dry_run }}
      wsl_rootfs_asset_name: kautuka-wsl-appliance.tar.gz
      kautuka_base_image: ${{ needs.resolve-kautuka-base.outputs.image }}
    secrets:
      release_manifest_private_key: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY }}

  publish-assets:
    name: Publish Release Assets
    needs:
      - resolve-channel
      - build-platform-assets
      - prepare-stable-draft
    if: ${{ needs.resolve-channel.outputs.dry_run != 'true' && needs.prepare-stable-draft.result == 'success' }}
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/release-publish-assets.yml
    with:
      channel: ${{ needs.resolve-channel.outputs.channel }}
      release_version: ${{ needs.resolve-channel.outputs.version }}
      release_tag: ${{ needs.resolve-channel.outputs.release_tag }}
      prerelease: ${{ needs.resolve-channel.outputs.prerelease }}
      dry_run: ${{ needs.resolve-channel.outputs.dry_run }}
      source_sha: ${{ needs.resolve-channel.outputs.source_sha }}
      wsl_rootfs_asset_name: kautuka-wsl-appliance.tar.gz
