name: View File Safety

on:
  push:
    paths:
      - 'src/backend/Kautuka.Manager.RuntimeContainer/Hosting/**'
      - 'src/tests/Kautuka.IntegrationTests/**'
      - '.github/workflows/view-file-safety.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  view-files:
    name: View files (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Save, open, replace, limit, and refuse links
        run: dotnet test --project src/tests/Kautuka.IntegrationTests/Kautuka.IntegrationTests.csproj -- --filter-class '*ViewFileMaterializerTests'
