name: Release Build Platform Assets

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      release_version:
        required: true
        type: string
      manifest_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      dry_run:
        required: true
        type: string
      wsl_rootfs_asset_name:
        required: true
        type: string
      kautuka_base_image:
        description: Immutable digest resolved from the separately released kautuka-base stable selector.
        required: true
        type: string
    secrets:
      release_manifest_private_key:
        required: true
jobs:
  build-linux-release-assets:
    name: Build Linux Release Assets
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.channel }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Pin the released sandbox image
        env:
          KAUTUKA_BASE_IMAGE: ${{ inputs.kautuka_base_image }}
        run: python3 scripts/pin-released-sandbox-image.py src/backend/Kautuka.Manager/runtime-images.json "$KAUTUKA_BASE_IMAGE"

      - name: Normalize artifact scope
        id: scope
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          artifact_scope="$(printf '%s' "$RELEASE_TAG" | tr -cs '[:alnum:]._-' '-')"
          artifact_scope="${artifact_scope#-}"
          artifact_scope="${artifact_scope%-}"
          if [[ -z "$artifact_scope" ]]; then
            echo 'error: normalized artifact scope is empty.' >&2
            exit 1
          fi

          echo "artifact_scope=$artifact_scope" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install frozen frontend dependency graph for release notices
        run: corepack enable && corepack prepare pnpm@11.5.2 --activate && pnpm --dir src/frontend install --frozen-lockfile

      - name: Write manifest signing key
        env:
          RELEASE_MANIFEST_PRIVATE_KEY: ${{ secrets.release_manifest_private_key }}
        run: |
          private_key_path="$RUNNER_TEMP/manifest-signing-key.pem"
          public_key_path="$RUNNER_TEMP/manifest-signing-public.pem"
          printf '%s\n' "$RELEASE_MANIFEST_PRIVATE_KEY" > "$private_key_path"
          chmod 600 "$private_key_path"
          openssl pkey -in "$private_key_path" -pubout -out "$public_key_path"
          chmod 644 "$public_key_path"
          printf 'RELEASE_MANIFEST_PRIVATE_KEY_PATH=%s\n' "$private_key_path" >> "$GITHUB_ENV"
          printf 'RELEASE_MANIFEST_PUBLIC_KEY_PATH=%s\n' "$public_key_path" >> "$GITHUB_ENV"

      - name: Build Linux platform, WSL rootfs, and descriptor assets
        env:
          CHANNEL: ${{ inputs.channel }}
          MANIFEST_VERSION: ${{ inputs.manifest_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KAUTUKA_RELEASE_CONTAINER_RUNTIME: docker
          KAUTUKA_BASE_IMAGE: ${{ inputs.kautuka_base_image }}
        run: |
          set -euo pipefail
          product_version="${MANIFEST_VERSION%%-preview.*}"
          artifact_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          bash scripts/build-release-assets.sh \
            --output-root publish/release-assets \
            --private-key "$RELEASE_MANIFEST_PRIVATE_KEY_PATH" \
            --manifest-public-key "$RELEASE_MANIFEST_PUBLIC_KEY_PATH" \
            --release-id "$RELEASE_TAG" \
            --release-tag "$RELEASE_TAG" \
            --version "$MANIFEST_VERSION" \
            --product-version "$product_version" \
            --source-sha "$SOURCE_SHA" \
            --channel "$CHANNEL" \
            --artifact-base-url "$artifact_base_url"

          # build-release-assets.sh keys its output directory on the manifest version.
          release_dir="publish/release-assets/$MANIFEST_VERSION"
          if [[ ! -d "$release_dir" ]]; then
            echo "error: expected release directory not found: $release_dir" >&2
            ls -la publish/release-assets >&2 || true
            exit 1
          fi

          printf '## Release Artifact Sizes\n\n' >> "$GITHUB_STEP_SUMMARY"
          for artifact in kautuka-linux-amd64.tar.gz '${{ inputs.wsl_rootfs_asset_name }}' kautuka-platform-release.json kautuka-platform-release.sig; do
            printf -- '- %s: `%s` (%s bytes)\n' \
              "$artifact" \
              "$(numfmt --to=iec-i --suffix=B "$(stat -c %s "$release_dir/$artifact")")" \
              "$(stat -c %s "$release_dir/$artifact")" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          cp "$RELEASE_MANIFEST_PUBLIC_KEY_PATH" "$release_dir/manifest-public-key.pem"

      - name: Verify release identity, signature, and artifact checksums
        env:
          RELEASE_DIR: publish/release-assets/${{ inputs.manifest_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node scripts/verify-release-artifacts.mjs \
            --directory "$RELEASE_DIR" \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --source-sha "$SOURCE_SHA" \
            --public-key "$RELEASE_MANIFEST_PUBLIC_KEY_PATH" \
            --platform-archive "$RELEASE_DIR/kautuka-linux-amd64.tar.gz"

      - name: Generate release third-party notices and inventory
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          KAUTUKA_BASE_IMAGE: ${{ inputs.kautuka_base_image }}
        run: |
          node scripts/generate-third-party-compliance.mjs \
            --output-dir "publish/release-assets/${{ inputs.manifest_version }}/compliance" \
            --release-tag "$RELEASE_TAG" \
            --base-image "$KAUTUKA_BASE_IMAGE"

      - name: Upload platform artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautuka-platform-linux-x64-${{ steps.scope.outputs.artifact_scope }}
          path: publish/release-assets/${{ inputs.manifest_version }}/kautuka-linux-amd64.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Upload prewarmed WSL rootfs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautuka-wsl-rootfs-${{ steps.scope.outputs.artifact_scope }}
          path: publish/release-assets/${{ inputs.manifest_version }}/${{ inputs.wsl_rootfs_asset_name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Upload platform release descriptor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautuka-platform-release-${{ steps.scope.outputs.artifact_scope }}
          path: |
            publish/release-assets/${{ inputs.manifest_version }}/kautuka-platform-release.json
            publish/release-assets/${{ inputs.manifest_version }}/kautuka-platform-release.sig
            publish/release-assets/${{ inputs.manifest_version }}/manifest-public-key.pem
            publish/release-assets/${{ inputs.manifest_version }}/compliance/**
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  build-windows-installer-assets:
    name: Build Windows Installer Assets
    runs-on: windows-latest
    environment:
      name: ${{ inputs.channel }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node for frontend release notices
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install frozen frontend dependency graph for release notices
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.5.2 --activate && pnpm --dir src/frontend install --frozen-lockfile

      - name: Pin the released sandbox image
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          KAUTUKA_BASE_IMAGE: ${{ inputs.kautuka_base_image }}
        run: python scripts/pin-released-sandbox-image.py src/backend/Kautuka.Manager/runtime-images.json "$KAUTUKA_BASE_IMAGE"

      - name: Normalize artifact scope
        id: scope
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRODUCT_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          artifact_scope="$(printf '%s' "$RELEASE_TAG" | tr -cs '[:alnum:]._-' '-')"
          artifact_scope="${artifact_scope#-}"
          artifact_scope="${artifact_scope%-}"
          if [[ -z "$artifact_scope" ]]; then
            echo 'error: normalized artifact scope is empty.' >&2
            exit 1
          fi

          echo "artifact_scope=$artifact_scope" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Write manifest signing public key
        env:
          RELEASE_MANIFEST_PRIVATE_KEY: ${{ secrets.release_manifest_private_key }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_MANIFEST_PRIVATE_KEY" > manifest-signing-key.pem
          chmod 600 manifest-signing-key.pem
          openssl pkey -in manifest-signing-key.pem -pubout -out manifest-signing-public.pem
          chmod 644 manifest-signing-public.pem

      - name: Publish Windows appliance installer
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          PRODUCT_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # InstallerVersion feeds System.Version for AssemblyVersion/FileVersion, so it
          # must stay Win32-safe Major.Minor.Patch. Leaving it unset lets the project
          # Product version is numeric for Windows version resources; informational metadata carries the build SHA.
          dotnet publish src/installer/Kautuka.Installer.Windows/Kautuka.Installer.Windows.csproj \
            --runtime win-x64 \
            -p:EnableWindowsTargeting=true \
            -p:InstallerReleaseChannel="${CHANNEL}" \
            -p:InstallerVersion="${PRODUCT_VERSION%%-preview.*}" \
            -p:Version="${PRODUCT_VERSION}" \
            -p:InformationalVersion="${PRODUCT_VERSION}+${SOURCE_SHA:0:7}" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -p:UseAppHost=true \
            -p:InstallerManifestPublicKeyPath="$(pwd)/manifest-signing-public.pem" \
            -c Release \
            -o publish/windows-installer

      - name: Normalize Windows installer asset name
        shell: pwsh
        run: |
          $preferredAsset = 'publish/windows-installer/Kautuka.Installer.exe'
          if (Test-Path $preferredAsset) {
            exit 0
          }

          $publishedExe = 'publish/windows-installer/Kautuka.Installer.Windows.exe'
          if (-not (Test-Path -LiteralPath $publishedExe)) {
            $publishedFiles = Get-ChildItem -LiteralPath 'publish/windows-installer' -Force |
              Select-Object -ExpandProperty Name
            throw "Kautuka.Installer.Windows.exe was not found. Published files: $($publishedFiles -join ', '). Refusing to rename another executable."
          }

          Move-Item -LiteralPath $publishedExe -Destination $preferredAsset

      - name: Verify Windows installer version metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $file = Get-Item -LiteralPath 'publish/windows-installer/Kautuka.Installer.exe'
          $expectedProduct = "$env:RELEASE_VERSION+$($env:SOURCE_SHA.Substring(0, 7))"
          $actualProduct = $file.VersionInfo.ProductVersion
          $actualFile = $file.VersionInfo.FileVersion
          if ($actualProduct -ne $expectedProduct) {
            throw "Installer ProductVersion '$actualProduct' does not match '$expectedProduct'."
          }
          if ($actualFile -ne "$($env:RELEASE_VERSION.Split('-')[0]).0") {
            throw "Installer FileVersion '$actualFile' does not match the resolved numeric version."
          }

      - name: Include project license and notice
        shell: pwsh
        run: |
          Copy-Item -LiteralPath LICENSE -Destination publish/windows-installer/LICENSE
          Copy-Item -LiteralPath NOTICE -Destination publish/windows-installer/NOTICE

      - name: Generate release third-party notices and inventory
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          KAUTUKA_BASE_IMAGE: ${{ inputs.kautuka_base_image }}
        run: |
          node scripts/generate-third-party-compliance.mjs \
            --output-dir publish/windows-installer \
            --release-tag "$RELEASE_TAG" \
            --base-image "$KAUTUKA_BASE_IMAGE"

      - name: Sign Windows appliance installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $signingStatusPath = 'publish/windows-installer/SIGNING-STATUS.txt'

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            Write-Host 'Skipping Authenticode signing because Windows signing secrets are not configured.'
            Set-Content -LiteralPath $signingStatusPath -Value @'
          UNSIGNED

          Authenticode secrets were not configured for this build.
          SmartScreen will warn.
          '@
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'kautuka-installer-signing.pfx'
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw 'signtool.exe was not found on the Windows runner.'
          }

          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_TIMESTAMP_URL)) {
            'http://timestamp.digicert.com'
          }
          else {
            $env:WINDOWS_SIGNING_TIMESTAMP_URL
          }

          & $signtool sign `
            /fd SHA256 `
            /td SHA256 `
            /tr $timestampUrl `
            /f $certificatePath `
            /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
            /d 'Kautuka Installer' `
            /du "https://kautuka.dev" `
            'publish/windows-installer/Kautuka.Installer.exe'

          if ($LASTEXITCODE -ne 0) {
            throw 'signtool sign failed.'
          }

          & $signtool verify /pa /v 'publish/windows-installer/Kautuka.Installer.exe'

          if ($LASTEXITCODE -ne 0) {
            throw 'signtool verify failed.'
          }

          Remove-Item $certificatePath -Force

          Set-Content -LiteralPath $signingStatusPath -Value @'
          SIGNED

          Authenticode signature verified with signtool /pa.
          '@

      - name: Upload Windows installer assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautuka-windows-installer-assets-${{ steps.scope.outputs.artifact_scope }}
          path: publish/windows-installer/**
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  build-linux-installer-assets:
    name: Build Linux Installer Assets
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.channel }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Pin the released sandbox image
        if: ${{ inputs.dry_run != 'true' }}
        env:
          KAUTUKA_BASE_IMAGE: ${{ inputs.kautuka_base_image }}
        run: python3 scripts/pin-released-sandbox-image.py src/backend/Kautuka.Manager/runtime-images.json "$KAUTUKA_BASE_IMAGE"

      - name: Normalize artifact scope
        id: scope
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          artifact_scope="$(printf '%s' "$RELEASE_TAG" | tr -cs '[:alnum:]._-' '-')"
          artifact_scope="${artifact_scope#-}"
          artifact_scope="${artifact_scope%-}"
          if [[ -z "$artifact_scope" ]]; then
            echo 'error: normalized artifact scope is empty.' >&2
            exit 1
          fi

          echo "artifact_scope=$artifact_scope" >> "$GITHUB_OUTPUT"

      - name: Write manifest signing key
        env:
          RELEASE_MANIFEST_PRIVATE_KEY: ${{ secrets.release_manifest_private_key }}
        run: |
          printf '%s\n' "$RELEASE_MANIFEST_PRIVATE_KEY" > manifest-signing-key.pem
          chmod 600 manifest-signing-key.pem
          openssl pkey -in manifest-signing-key.pem -pubout -out manifest-signing-public.pem
          chmod 644 manifest-signing-public.pem

      - name: Create Linux installer release asset
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p publish/linux-installer
          bash scripts/generate-linux-installer.sh \
            --output publish/linux-installer/kautuka-install-linux.sh \
            --version "$RELEASE_VERSION" \
            --release-channel "$CHANNEL" \
            --manifest-public-key manifest-signing-public.pem

      - name: Attest Linux installer provenance
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: publish/linux-installer/kautuka-install-linux.sh

      - name: Upload Linux installer assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautuka-linux-installer-assets-${{ steps.scope.outputs.artifact_scope }}
          path: publish/linux-installer/kautuka-install-linux.sh
          if-no-files-found: error
          overwrite: true
          retention-days: 3
