version: 2
updates:
  # NuGet dependencies: weekly updates, conservative (patch + security)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version bumps for higher stability; evaluate manually
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # npm/pnpm dependencies in frontend: weekly
  - package-ecosystem: "npm"
    directory: "/src/frontend/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 3
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions: weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 3
