[project]
name = "kautuka-web-tools"
version = "0.1.0"
license = "Apache-2.0"
description = "Standalone MCP web retrieval tools for Kautuka."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.14.3",
    "httpx[http2]==0.28.1",
    "markitdown==0.1.6",
    "mcp[cli]==1.30.0",
    "trafilatura==2.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
kautuka-web-tools = "kautuka_web_tools.server:main"

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kautuka_web_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
