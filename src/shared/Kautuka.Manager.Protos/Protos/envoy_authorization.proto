syntax = "proto3";
package envoy.service.auth.v3;
option csharp_namespace = "Kautuka.Manager.Protos.EnvoyAuthorization";

// Wire-compatible projection of Envoy v3 Authorization. Fields not needed by
// TCP admission are intentionally omitted and remain protobuf unknown fields.
// Field numbers follow Envoy's Apache-2.0 service/auth/v3 API.
service Authorization {
  rpc Check(CheckRequest) returns (CheckResponse);
}
message CheckRequest { AttributeContext attributes = 1; }
message AttributeContext {
  Peer source = 1;
  Peer destination = 2;
  TLSSession tls_session = 12;
}
message Peer { Address address = 1; string service = 2; }
message Address { SocketAddress socket_address = 1; }
message SocketAddress {
  int32 protocol = 1;
  string address = 2;
  uint32 port_value = 3;
}
message TLSSession { string sni = 1; }
message CheckResponse { Status status = 1; }
message Status { int32 code = 1; string message = 2; }
