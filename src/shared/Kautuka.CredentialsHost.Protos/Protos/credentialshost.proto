syntax = "proto3";

option csharp_namespace = "Kautuka.Protos";

package kautuka.credentials.v1;

service CredentialsService {
  rpc GetHealth                (CredentialHealthRequest)             returns (CredentialHealthResponse);
  rpc GetResolvedCredentials   (GetResolvedCredentialsRequest)       returns (CredentialMapResponse);
  rpc GetSystemCredential      (GetSystemCredentialRequest)          returns (CredentialMapResponse);
  rpc ListUserCredentialKeys   (ListUserCredentialKeysRequest)       returns (CredentialKeyListResponse);
  rpc SetUserCredentials       (SetUserCredentialsRequest)           returns (SetCredentialsResponse);
  rpc DeleteUserCredential     (DeleteUserCredentialRequest)         returns (DeleteCredentialResponse);
  rpc ListSystemCredentialKeys (ListSystemCredentialKeysRequest)     returns (CredentialKeyListResponse);
  rpc SetSystemCredentials     (SetSystemCredentialsRequest)         returns (SetCredentialsResponse);
  rpc DeleteSystemCredential   (DeleteSystemCredentialRequest)       returns (DeleteCredentialResponse);
}

message CredentialHealthRequest {}

enum CredentialHealthState {
  CREDENTIAL_HEALTH_STATE_UNSPECIFIED = 0;
  CREDENTIAL_HEALTH_STATE_READY = 1;
  CREDENTIAL_HEALTH_STATE_DEGRADED = 2;
  CREDENTIAL_HEALTH_STATE_INTEGRITY_FAILED = 3;
}

message CredentialHealthResponse {
  CredentialHealthState state = 1;
  int64 active_client_certificate_not_after_unix_seconds = 2;
}

enum CredentialCapability {
  CREDENTIAL_CAPABILITY_UNSPECIFIED = 0;
  CREDENTIAL_CAPABILITY_RUNTIME_RESOLVE = 1;
  CREDENTIAL_CAPABILITY_OWN_USER_ADMIN = 2;
  CREDENTIAL_CAPABILITY_CROSS_USER_ADMIN = 3;
  CREDENTIAL_CAPABILITY_SYSTEM_ADMIN = 4;
}

message CredentialAccessContext {
  string actor_id = 1;
  CredentialCapability capability = 2;
}

// ────────────────────────────────────────────────
// GetResolvedCredentials
// Merges user-scope and system-scope for the requested keys.
// User-scope wins over system-scope on key collision.
// Keys absent from both scopes are omitted from the response — no error raised.
// ────────────────────────────────────────────────

message GetResolvedCredentialsRequest {
  string          user_id       = 1;
  repeated string required_keys = 2;
  CredentialAccessContext access = 3;
  // Empty user id still returns system scope. A named user receives system scope only when this is set.
  bool include_system_scope = 4;
  // Refresh-token and DPoP keys stay out of a resolve unless the caller is the token store.
  bool include_held_secrets = 5;
}

message CredentialMapResponse {
  map<string, string> entries = 1;
}

// ────────────────────────────────────────────────
// User credential management
// ────────────────────────────────────────────────

message ListUserCredentialKeysRequest {
  string user_id = 1;
  CredentialAccessContext access = 2;
}

message CredentialKeyListResponse {
  repeated string keys = 1;
}

message SetUserCredentialsRequest {
  string              user_id = 1;
  map<string, string> entries = 2;
  CredentialAccessContext access = 3;
  string operation_id = 4;
}

message SetCredentialsResponse {
  int32 upserted_count = 1;
}

message DeleteUserCredentialRequest {
  string user_id = 1;
  string key     = 2;
  CredentialAccessContext access = 3;
  string operation_id = 4;
}

message DeleteCredentialResponse {
  bool deleted = 1;
}

// ────────────────────────────────────────────────
// System credential management (admin-only enforcement is in Gateway)
// ────────────────────────────────────────────────

message ListSystemCredentialKeysRequest {
  CredentialAccessContext access = 1;
}

message GetSystemCredentialRequest {
  string key = 1;
  CredentialAccessContext access = 2;
}

message SetSystemCredentialsRequest {
  map<string, string> entries = 1;
  CredentialAccessContext access = 2;
  string operation_id = 3;
}

message DeleteSystemCredentialRequest {
  string key = 1;
  CredentialAccessContext access = 2;
  string operation_id = 3;
}
