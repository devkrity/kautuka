syntax = "proto3";

option csharp_namespace = "Kautuka.Protos";

package kautuka.credentials.v1;

service CredentialsService {
  rpc StageConnectorAssociation (StageConnectorAssociationRequest) returns (StageConnectorAssociationResponse);
  rpc StageConnectorMutation (StageConnectorMutationRequest) returns (StageConnectorAssociationResponse);
  rpc GetStagedConnectorDraft (ConnectorDraftAccessRequest) returns (ConnectorDraftMetadata);
  rpc ResolveConnectorAssociation (ResolveConnectorAssociationRequest) returns (CredentialMapResponse);
  rpc GetConnectorAssociationPresence (ResolveConnectorAssociationRequest) returns (ConnectorAssociationPresenceResponse);
  rpc ListConnectorDrafts    (ListConnectorDraftsRequest) returns (ConnectorDraftListResponse);
  rpc CreateConnectorDraft    (CreateConnectorDraftRequest) returns (ConnectorDraftMetadata);
  rpc GetConnectorDraft       (ConnectorDraftAccessRequest) returns (ConnectorDraftMetadata);
  rpc ResolveConnectorDraft   (ResolveConnectorDraftRequest) returns (CredentialMapResponse);
  rpc CancelConnectorDraft    (ConnectorDraftAccessRequest) returns (DeleteCredentialResponse);
  rpc DiscardConnectorDraftInput (ConnectorDraftAccessRequest) returns (DeleteCredentialResponse);
  rpc GetHealth                (CredentialHealthRequest)             returns (CredentialHealthResponse);
  rpc GetResolvedCredentials   (GetResolvedCredentialsRequest)       returns (CredentialMapResponse);
  rpc GetSystemCredential      (GetSystemCredentialRequest)          returns (CredentialMapResponse);
  rpc ListUserCredentialKeys   (ListUserCredentialKeysRequest)       returns (CredentialKeyListResponse);
  rpc SetUserCredentials       (SetUserCredentialsRequest)           returns (SetCredentialsResponse);
  rpc DeleteUserCredential     (DeleteUserCredentialRequest)         returns (DeleteCredentialResponse);
  rpc ListSystemCredentialKeys (ListSystemCredentialKeysRequest)     returns (CredentialKeyListResponse);
  rpc SetSystemCredentials     (SetSystemCredentialsRequest)         returns (SetCredentialsResponse);
  rpc DeleteSystemCredential   (DeleteSystemCredentialRequest)       returns (DeleteCredentialResponse);
}

message CredentialHealthRequest {}

enum CredentialHealthState {
  CREDENTIAL_HEALTH_STATE_UNSPECIFIED = 0;
  CREDENTIAL_HEALTH_STATE_READY = 1;
  CREDENTIAL_HEALTH_STATE_DEGRADED = 2;
  CREDENTIAL_HEALTH_STATE_INTEGRITY_FAILED = 3;
}

message CredentialHealthResponse {
  CredentialHealthState state = 1;
  int64 active_client_certificate_not_after_unix_seconds = 2;
}

enum CredentialCapability {
  CREDENTIAL_CAPABILITY_UNSPECIFIED = 0;
  CREDENTIAL_CAPABILITY_RUNTIME_RESOLVE = 1;
  CREDENTIAL_CAPABILITY_OWN_USER_ADMIN = 2;
  CREDENTIAL_CAPABILITY_CROSS_USER_ADMIN = 3;
  CREDENTIAL_CAPABILITY_SYSTEM_ADMIN = 4;
}

message CredentialAccessContext {
  string actor_id = 1;
  CredentialCapability capability = 2;
}

// ────────────────────────────────────────────────
// GetResolvedCredentials
// Merges user-scope and system-scope for the requested keys.
// User-scope wins over system-scope on key collision.
// Keys absent from both scopes are omitted from the response — no error raised.
// ────────────────────────────────────────────────

message GetResolvedCredentialsRequest {
  string          user_id       = 1;
  repeated string required_keys = 2;
  CredentialAccessContext access = 3;
  // Empty user id still returns system scope. A named user receives system scope only when this is set.
  bool include_system_scope = 4;
  // Refresh-token and DPoP keys stay out of a resolve unless the caller is the token store.
  bool include_held_secrets = 5;
}

message CredentialMapResponse {
  map<string, string> entries = 1;
}

// ────────────────────────────────────────────────
// User credential management
// ────────────────────────────────────────────────

message ListUserCredentialKeysRequest {
  string user_id = 1;
  CredentialAccessContext access = 2;
}

message CredentialKeyListResponse {
  repeated string keys = 1;
}

message SetUserCredentialsRequest {
  string              user_id = 1;
  map<string, string> entries = 2;
  CredentialAccessContext access = 3;
  string operation_id = 4;
}

message SetCredentialsResponse {
  int32 upserted_count = 1;
}

message DeleteUserCredentialRequest {
  string user_id = 1;
  string key     = 2;
  CredentialAccessContext access = 3;
  string operation_id = 4;
}

message DeleteCredentialResponse {
  bool deleted = 1;
}

// ────────────────────────────────────────────────
// System credential management (admin-only enforcement is in Gateway)
// ────────────────────────────────────────────────

message ListSystemCredentialKeysRequest {
  CredentialAccessContext access = 1;
}

message GetSystemCredentialRequest {
  string key = 1;
  CredentialAccessContext access = 2;
}

message SetSystemCredentialsRequest {
  map<string, string> entries = 1;
  CredentialAccessContext access = 2;
  string operation_id = 3;
}

message DeleteSystemCredentialRequest {
  string key = 1;
  CredentialAccessContext access = 2;
  string operation_id = 3;
}

// Drafts contain encrypted temporary credentials and non-secret immutable metadata only.
message CreateConnectorDraftRequest {
  CredentialAccessContext access = 1;
  string draft_id = 2;
  string connector_id = 3;
  string credential_scope = 4;
  string candidate_json = 5;
  string base_updated_at = 6;
  repeated string declared_keys = 7;
  map<string, string> entries = 8;
  repeated string remove_keys = 9;
  string effective_endpoint = 10;
  string base_endpoint = 11;
  bool use_durable_credentials = 12;
  string credential_namespace = 13;
  string source_association_id = 14;
}
message ConnectorDraftAccessRequest {
  CredentialAccessContext access = 1;
  string draft_id = 2;
}
message StageConnectorAssociationRequest {
  CredentialAccessContext access = 1;
  string draft_id = 2;
  string source_association_id = 3;
}
message StageConnectorAssociationResponse { string association_id = 1; }
message StageConnectorMutationRequest {
  CredentialAccessContext access = 1;
  string operation_id = 2;
  string connector_id = 3;
  string credential_namespace = 4;
  string source_association_id = 5;
  string credential_scope = 6;
  map<string, string> entries = 7;
  repeated string remove_keys = 8;
}
message ResolveConnectorAssociationRequest {
  CredentialAccessContext access = 1;
  string association_id = 2;
  string user_id = 3;
  repeated string required_keys = 4;
  bool include_system_scope = 5;
  string connector_id = 6;
  string credential_namespace = 7;
}
message ConnectorAssociationPresenceResponse {
  repeated string user_keys = 1;
  repeated string system_keys = 2;
}
message ResolveConnectorDraftRequest {
  CredentialAccessContext access = 1;
  string draft_id = 2;
  repeated string required_keys = 3;
  bool include_system_scope = 4;
}
message ConnectorDraftMetadata {
  reserved 7, 12;
  string draft_id = 1;
  string connector_id = 2;
  string credential_scope = 3;
  string candidate_json = 4;
  string base_updated_at = 5;
  int64 expires_at_unix_seconds = 6;
  string effective_endpoint = 8;
  string base_endpoint = 9;
  bool use_durable_credentials = 10;
  string credential_namespace = 11;
  string source_association_id = 13;
}


message ListConnectorDraftsRequest { CredentialAccessContext access = 1; }
message ConnectorDraftListResponse { repeated ConnectorDraftMetadata drafts = 1; }
