min_version: 2.2.2
assert_lefthook_installed: true
lefthook: pnpm exec lefthook

pre-commit:
  parallel: true
  jobs:
    - name: documentation
      group:
        piped: true
        jobs:
          - run: node ./scripts/confirm-docs-updated.mjs
          - run: node ./scripts/validate-docs.mjs
    - name: staged-secrets
      run: node ./scripts/run-precommit-secret-scan.mjs
    - name: staged-csharp-format
      glob: "**/*.cs"
      run: dotnet format whitespace src/Kautuka.slnx --include {staged_files} --no-restore --verbosity quiet
      stage_fixed: true
    - name: staged-frontend-lint
      root: src/frontend/web
      glob:
        - "**/*.ts"
        - "**/*.tsx"
      run: pnpm exec eslint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: backend-validation
      run: >-
        dotnet restore src/Kautuka.slnx &&
        dotnet format whitespace src/Kautuka.slnx --no-restore --verify-no-changes --verbosity normal &&
        dotnet build src/Kautuka.slnx --no-restore &&
        dotnet test --solution src/Kautuka.slnx --no-build --verbosity minimal
        --filter 'FullyQualifiedName!~Kautuka.ApiFlowTests' -- --ignore-exit-code 8
    - name: frontend-validation
      group:
        piped: true
        jobs:
          - name: frontend-lint
            run: pnpm --dir src/frontend/web exec eslint src --ext .ts,.tsx
          - name: frontend-tests
            run: pnpm --dir src/frontend/web exec vitest run
          - name: frontend-build
            run: pnpm --dir src/frontend/web exec vite build
